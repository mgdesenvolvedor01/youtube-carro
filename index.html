<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>YouTube no Carro</title>
<style>
  :root{
    --bg:#0b0b10;
    --panel:#15151d;
    --panel2:#1e1e28;
    --accent:#ff3b3b;
    --text:#f5f5f7;
    --muted:#9a9aa5;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    height:100%;overflow:hidden;
  }
  #app{
    display:flex;flex-direction:column;height:100vh;width:100vw;
  }

  /* ---------- TOPO: busca ---------- */
  #topbar{
    display:flex;gap:10px;align-items:center;
    padding:14px 16px;background:var(--panel);
    border-bottom:1px solid #2a2a35;
    flex-shrink:0;
  }
  #topbar.hidden{display:none;}
  #settingsBtn{
    flex-shrink:0;font-size:24px;background:var(--panel2);color:var(--text);
    border:2px solid #333;border-radius:14px;padding:12px 16px;cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  #searchInput{
    flex:1;min-width:0;
    font-size:22px;padding:14px 16px;border-radius:14px;
    border:2px solid #2a2a35;background:var(--panel2);color:var(--text);
    outline:none;
  }
  #searchInput:focus{border-color:var(--accent);}
  .btn{
    font-size:20px;font-weight:600;padding:14px 20px;border-radius:14px;
    border:none;background:var(--accent);color:#fff;cursor:pointer;
    flex-shrink:0;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
  }
  .btn:active{filter:brightness(0.85);}
  .btn.secondary{background:var(--panel2);color:var(--text);border:2px solid #333;}

  /* ---------- CONTEÚDO ---------- */
  #content{
    flex:1;min-height:0;display:flex;flex-direction:column;
  }

  #home{
    flex:1;overflow-y:auto;padding:18px;
  }
  #home h2{
    font-size:18px;color:var(--muted);margin:10px 0 14px;font-weight:600;
    text-transform:uppercase;letter-spacing:1px;
  }
  #favGrid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
    gap:14px;
  }
  .favCard{
    background:var(--panel);border:2px solid #24242f;border-radius:16px;
    padding:18px 10px;text-align:center;cursor:pointer;
    font-size:18px;font-weight:600;
    display:flex;flex-direction:column;align-items:center;gap:8px;
    -webkit-tap-highlight-color:transparent;
  }
  .favCard:active{background:var(--panel2);border-color:var(--accent);}
  .favCard .emoji{font-size:34px;}
  .favCard .del{
    margin-top:4px;font-size:13px;color:var(--muted);font-weight:400;
  }
  #addFavBtn{
    background:var(--panel);border:2px dashed #3a3a48;border-radius:16px;
    display:flex;align-items:center;justify-content:center;
    font-size:34px;color:var(--muted);cursor:pointer;min-height:110px;
  }

  #playerWrap{
    display:none;flex:1;min-height:0;flex-direction:column;background:#000;
  }
  #playerWrap.active{display:flex;}
  #playerBar{
    display:flex;align-items:center;justify-content:space-between;
    padding:10px 14px;background:var(--panel);flex-shrink:0;
  }
  #iframeHolder{flex:1;min-height:0;position:relative;background:#000;}
  #iframeHolder iframe{
    position:absolute;inset:0;width:100%;height:100%;border:0;
  }

  #emptyMsg{
    color:var(--muted);font-size:17px;line-height:1.5;padding:10px 4px 20px;
  }

  /* modal simples pra adicionar favorito */
  #favModal{
    position:fixed;inset:0;background:rgba(0,0,0,0.6);
    display:none;align-items:center;justify-content:center;z-index:50;
  }
  #favModal.show{display:flex;}
  #favModalBox{
    background:var(--panel);border-radius:18px;padding:22px;width:90%;max-width:480px;
  }
  #favModalBox h3{margin:0 0 14px;font-size:20px;}
  #favModalBox input{
    width:100%;font-size:18px;padding:12px 14px;border-radius:10px;
    border:2px solid #2a2a35;background:var(--panel2);color:var(--text);
    margin-bottom:12px;outline:none;
  }
  #favModalBox .row{display:flex;gap:10px;justify-content:flex-end;}

  /* ---------- resultados de busca ---------- */
  #searchResults{
    display:none;flex:1;overflow-y:auto;padding:18px;
  }
  #searchResults.active{display:block;}
  #searchResults h2{
    font-size:18px;color:var(--muted);margin:0 0 14px;font-weight:600;
  }
  #resultsGrid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
    gap:16px;
  }
  .resultCard{
    background:var(--panel);border:2px solid #24242f;border-radius:16px;
    overflow:hidden;cursor:pointer;-webkit-tap-highlight-color:transparent;
  }
  .resultCard:active{border-color:var(--accent);}
  .resultCard img{width:100%;display:block;aspect-ratio:16/9;object-fit:cover;background:#000;}
  .resultCard .rTitle{
    padding:12px;font-size:16px;font-weight:600;line-height:1.3;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .resultCard .rChannel{padding:0 12px 12px;font-size:13px;color:var(--muted);}
  #resultsMsg{color:var(--muted);font-size:17px;padding:4px 0 16px;}
</style>
</head>
<body>
<div id="app">

  <div id="topbar">
    <input id="searchInput" type="text" placeholder="Buscar ou colar link do YouTube..." autocomplete="off" autocorrect="off" spellcheck="false">
    <button class="btn" id="goBtn">▶ Ir</button>
    <button id="settingsBtn" title="Configurar chave de API">⚙️</button>
  </div>

  <div id="content">

    <div id="home">
      <div id="emptyMsg">Digite uma busca ou cole um link/ID de vídeo acima, ou toque em um dos favoritos.</div>
      <h2>Favoritos</h2>
      <div id="favGrid"></div>
    </div>

    <div id="searchResults">
      <h2>Resultados</h2>
      <div id="resultsMsg"></div>
      <div id="resultsGrid"></div>
    </div>

    <div id="playerWrap">
      <div id="playerBar">
        <button class="btn secondary" id="backBtn">⟵ Voltar</button>
        <button class="btn" id="fullscreenBtn">⛶ Tela cheia</button>
      </div>
      <div id="iframeHolder"></div>
    </div>

  </div>
</div>

<div id="favModal">
  <div id="favModalBox">
    <h3>Novo favorito</h3>
    <input id="favName" type="text" placeholder="Nome (ex: Lofi pra dirigir)">
    <input id="favQuery" type="text" placeholder="Link do vídeo/playlist ou termo de busca">
    <div class="row">
      <button class="btn secondary" id="favCancel">Cancelar</button>
      <button class="btn" id="favSave">Salvar</button>
    </div>
  </div>
</div>

<div id="settingsModal" style="position:fixed;inset:0;background:rgba(0,0,0,0.6);display:none;align-items:center;justify-content:center;z-index:50;">
  <div style="background:var(--panel);border-radius:18px;padding:22px;width:90%;max-width:480px;">
    <h3 style="margin:0 0 10px;font-size:20px;">Chave da YouTube API</h3>
    <p style="color:var(--muted);font-size:15px;line-height:1.4;margin:0 0 14px;">
      Cole aqui a chave que você criou no Google Cloud Console. Ela fica guardada só neste celular/navegador.
    </p>
    <input id="apiKeyInput" type="text" placeholder="Cole a chave aqui" style="width:100%;font-size:17px;padding:12px 14px;border-radius:10px;border:2px solid #2a2a35;background:var(--panel2);color:var(--text);margin-bottom:14px;outline:none;">
    <div style="display:flex;gap:10px;justify-content:flex-end;">
      <button class="btn secondary" id="apiKeyCancel">Cancelar</button>
      <button class="btn" id="apiKeySave">Salvar</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  var STORAGE_KEY = "ytcarro_favs_v1";
  var API_KEY_STORAGE = "ytcarro_apikey_v1";
  var defaultFavs = [
    {name:"Música pra dirigir", q:"playlist musica para dirigir", emoji:"🎵"},
    {name:"Notícias", q:"noticias hoje", emoji:"📰"},
    {name:"Podcast", q:"podcast", emoji:"🎙️"}
  ];

  function loadFavs(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(raw) return JSON.parse(raw);
    }catch(e){}
    return defaultFavs.slice();
  }
  function saveFavs(favs){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(favs)); }catch(e){}
  }

  var favs = loadFavs();

  var searchInput = document.getElementById("searchInput");
  var goBtn = document.getElementById("goBtn");
  var home = document.getElementById("home");
  var favGrid = document.getElementById("favGrid");
  var playerWrap = document.getElementById("playerWrap");
  var iframeHolder = document.getElementById("iframeHolder");
  var backBtn = document.getElementById("backBtn");
  var fullscreenBtn = document.getElementById("fullscreenBtn");
  var topbar = document.getElementById("topbar");

  var favModal = document.getElementById("favModal");
  var favName = document.getElementById("favName");
  var favQuery = document.getElementById("favQuery");
  var favSave = document.getElementById("favSave");
  var favCancel = document.getElementById("favCancel");

  var searchResults = document.getElementById("searchResults");
  var resultsGrid = document.getElementById("resultsGrid");
  var resultsMsg = document.getElementById("resultsMsg");

  var settingsBtn = document.getElementById("settingsBtn");
  var settingsModal = document.getElementById("settingsModal");
  var apiKeyInput = document.getElementById("apiKeyInput");
  var apiKeySave = document.getElementById("apiKeySave");
  var apiKeyCancel = document.getElementById("apiKeyCancel");

  function getApiKey(){
    try{ return localStorage.getItem(API_KEY_STORAGE) || ""; }catch(e){ return ""; }
  }
  function setApiKey(k){
    try{ localStorage.setItem(API_KEY_STORAGE, k); }catch(e){}
  }

  settingsBtn.addEventListener("click", function(){
    apiKeyInput.value = getApiKey();
    settingsModal.style.display = "flex";
  });
  apiKeyCancel.addEventListener("click", function(){
    settingsModal.style.display = "none";
  });
  apiKeySave.addEventListener("click", function(){
    setApiKey(apiKeyInput.value.trim());
    settingsModal.style.display = "none";
  });

  function showHome(){
    home.style.display = "block";
    searchResults.classList.remove("active");
  }

  function showResults(){
    home.style.display = "none";
    searchResults.classList.add("active");
  }

  function escapeHtml(s){
    return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }

  function runSearch(query){
    var key = getApiKey();
    topbar.classList.remove("hidden");
    playerWrap.classList.remove("active");
    iframeHolder.innerHTML = "";
    showResults();
    resultsGrid.innerHTML = "";

    if(!key){
      resultsMsg.innerHTML =
        '<a href="' + searchUrl(query) + '" style="display:inline-block;background:var(--accent);color:#fff;font-size:20px;font-weight:600;padding:16px 22px;border-radius:14px;text-decoration:none;">▶ Abrir busca "' + escapeHtml(query) + '" no YouTube</a>' +
        '<div style="margin-top:14px;color:var(--muted);font-size:14px;">Dica: toque na engrenagem (⚙️) pra configurar uma chave de API gratuita e ver os resultados direto aqui.</div>';
      return;
    }

    resultsMsg.textContent = "Buscando...";

    var url = "https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&maxResults=16&q="
      + encodeURIComponent(query) + "&key=" + encodeURIComponent(key);

    fetch(url)
      .then(function(r){ return r.json(); })
      .then(function(data){
        if(data.error){
          resultsMsg.textContent = "Erro na busca: " + (data.error.message || "verifique sua chave de API.");
          return;
        }
        var items = data.items || [];
        if(items.length === 0){
          resultsMsg.textContent = "Nenhum resultado encontrado.";
          return;
        }
        resultsMsg.textContent = "";
        items.forEach(function(item){
          var vid = item.id && item.id.videoId;
          if(!vid) return;
          var title = escapeHtml(item.snippet.title || "");
          var channel = escapeHtml(item.snippet.channelTitle || "");
          var thumb = (item.snippet.thumbnails && (item.snippet.thumbnails.medium || item.snippet.thumbnails.default)) || {};
          var card = document.createElement("div");
          card.className = "resultCard";
          card.innerHTML =
            '<img src="' + (thumb.url || "") + '" alt="">' +
            '<div class="rTitle">' + title + '</div>' +
            '<div class="rChannel">' + channel + '</div>';
          card.addEventListener("click", function(){
            openPlayer(vid);
          });
          resultsGrid.appendChild(card);
        });
      })
      .catch(function(err){
        resultsMsg.innerHTML =
          '<a href="' + searchUrl(query) + '" style="display:inline-block;background:var(--accent);color:#fff;font-size:20px;font-weight:600;padding:16px 22px;border-radius:14px;text-decoration:none;">▶ Abrir busca "' + escapeHtml(query) + '" no YouTube</a>' +
          '<div style="margin-top:14px;color:var(--muted);font-size:13px;">Não consegui buscar embutido aqui (bloqueio de rede deste visualizador). Detalhe técnico: ' + escapeHtml(String(err && err.message || err)) + '</div>';
      });
  }

  function extractVideoId(input){
    input = input.trim();
    var patterns = [
      /(?:v=|\/videos\/|embed\/|youtu\.be\/|\/v\/|\/shorts\/)([a-zA-Z0-9_-]{11})/,
      /^([a-zA-Z0-9_-]{11})$/
    ];
    for(var i=0;i<patterns.length;i++){
      var m = input.match(patterns[i]);
      if(m) return m[1];
    }
    return null;
  }

  function extractPlaylistId(input){
    var m = input.match(/[?&]list=([a-zA-Z0-9_-]+)/);
    return m ? m[1] : null;
  }

  function openPlayer(input){
    if(!input || !input.trim()) return;
    input = input.trim();

    var id = extractVideoId(input);
    var playlistId = !id ? extractPlaylistId(input) : null;

    if(id || playlistId){
      var url = id
        ? "https://www.youtube.com/embed/" + id + "?autoplay=1&playsinline=1"
        : "https://www.youtube.com/embed/videoseries?list=" + playlistId + "&autoplay=1&playsinline=1";
      iframeHolder.innerHTML = "";
      var iframe = document.createElement("iframe");
      iframe.src = url;
      iframe.setAttribute("allow", "autoplay; encrypted-media; fullscreen; picture-in-picture");
      iframe.setAttribute("allowfullscreen", "true");
      iframeHolder.appendChild(iframe);
      playerWrap.classList.add("active");
      home.style.display = "none";
      searchResults.classList.remove("active");
      topbar.classList.add("hidden");
      return;
    }

    // termo de busca: se tiver chave de API configurada, tenta a busca
    // embutida; senão (ou se falhar), cai pro link direto do YouTube.
    runSearch(input);
  }

  function searchUrl(query){
    return "https://www.youtube.com/results?search_query=" + encodeURIComponent(query);
  }

  function closePlayer(){
    playerWrap.classList.remove("active");
    iframeHolder.innerHTML = "";
    topbar.classList.remove("hidden");
    showHome();
  }

  function renderFavs(){
    favGrid.innerHTML = "";
    favs.forEach(function(f, idx){
      var card = document.createElement("div");
      card.className = "favCard";
      card.innerHTML =
        '<div class="emoji">' + (f.emoji || "⭐") + '</div>' +
        '<div>' + f.name + '</div>' +
        '<div class="del" data-idx="' + idx + '">remover</div>';
      card.addEventListener("click", function(ev){
        if(ev.target.classList.contains("del")){
          favs.splice(idx,1);
          saveFavs(favs);
          renderFavs();
          return;
        }
        openPlayer(f.q);
      });
      favGrid.appendChild(card);
    });

    var addCard = document.createElement("div");
    addCard.id = "addFavBtn";
    addCard.textContent = "+";
    addCard.addEventListener("click", function(){
      favName.value = "";
      favQuery.value = "";
      favModal.classList.add("show");
    });
    favGrid.appendChild(addCard);
  }

  goBtn.addEventListener("click", function(){
    openPlayer(searchInput.value);
  });
  searchInput.addEventListener("keydown", function(e){
    if(e.key === "Enter"){ openPlayer(searchInput.value); }
  });
  backBtn.addEventListener("click", closePlayer);

  fullscreenBtn.addEventListener("click", function(){
    var el = playerWrap;
    try{
      if(el.requestFullscreen){ el.requestFullscreen(); }
      else if(el.webkitRequestFullscreen){ el.webkitRequestFullscreen(); }
    }catch(e){}
  });

  favCancel.addEventListener("click", function(){
    favModal.classList.remove("show");
  });
  favSave.addEventListener("click", function(){
    var n = favName.value.trim();
    var q = favQuery.value.trim();
    if(!n || !q){ return; }
    favs.push({name:n, q:q, emoji:"⭐"});
    saveFavs(favs);
    renderFavs();
    favModal.classList.remove("show");
  });

  renderFavs();
})();
</script>
</body>
</html>
